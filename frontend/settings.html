<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard-container">


<h1>⚙ Settings</h1>

<div class="card">
    <h2>🌙 Dark Mode</h2>
    <button>Enable</button>
</div>

<div class="card">
    <h2>🎤 Voice Assistant</h2>
    <button>ON</button>
</div>

<div class="card">
    <h2>🌐 Language</h2>
    <select>
        <option>English</option>
        <option>Telugu</option>
        <option>Hindi</option>
    </select>
</div>

<div class="card">
    <h2>🔔 Notifications</h2>
    <button>Enable</button>
</div>


</div>

</body>
</html>
